spring.application.name=ecomovement-api

spring.config.import=optional:file:.env[.properties]

db.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
db.usuario=${DB_USER:rm000000}
db.senha=${DB_PASSWORD:000000}

server.port=${PORT:8080}
api.url=${API_URL:http://localhost:8080}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

cors.origens=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
